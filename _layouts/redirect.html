<!doctype html>
<html lang="{{ site.locale | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url | escape }}">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url | escape }}">
    <meta name="robots" content="noindex">
  </head>
  <body>
    <p>This content has moved to <a href="{{ page.redirect_to | relative_url }}">{{ page.title | escape }}</a>.</p>
  </body>
</html>
