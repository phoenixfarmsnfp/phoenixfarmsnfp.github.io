- question: "What is a Food Forest?"
  answer: "A 'food forest' is generally a collection of low-maintenance, largely perennial plants chosen to function well together as an ecological system while producing edible yield. Unlike traditional backyard gardens or agriculture that tend to replant annuals like tomatoes, cucumbers, or corn, food forests host a diversity of plants designed to persist year to year. Food forests incorporate both native and naturalized plants to balance adaptation to the local environment, edible yields, and functional ecology. \n See our Food Forest page under Our Work to learn more information on how food forests function, the ways they benefit their community, and the manners they can support local ecosystems."

- question: "What's the point?"
  answer: "Food forests can provide tangible benefits in many areas. Ecologically, they support both plant and animal biodiversity by hosting pollinator plants and the organisms that depend on them. Or, they can reduce air and noise pollution, provide shade, and reduce soil erosion by slowly stormwater runoff. In local neighborhoods, food forests can provide both fresh and organic produce while becoming a community space for both gathering and direct engagement with greenspaces. Having food forests not only supports local biodiversity, mitigates urban pollution, and improves health for residents — they also can further beautify our cityscapes. "

