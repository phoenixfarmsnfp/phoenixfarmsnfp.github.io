# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Theme Settings
#
# Review documentation to determine if you should use `theme` or `remote_theme`
# https://mmistakes.github.io/minimal-mistakes/docs/quick-start-guide/#installing-the-theme

theme                   : "minimal-mistakes-jekyll"
# remote_theme           : "mmistakes/minimal-mistakes"
minimal_mistakes_skin    : "phoenix-farms" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise", "catppuccin_latte", "catppuccin_mocha", "phoenix-farms"

# Site Settings
locale                   : "en-US"
direction                : # "ltr" (default), "rtl" # set the direction of the page
title                    : "Phoenix Farms"
title_separator          : "-"
subtitle                 : # site tagline that appears below site title in masthead
name                     : "Phoenix Farms"
description              : "A living project rooted in food, land, and community."
url                      : # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : # the subpath of your site, e.g. "/blog"
repository               : # GitHub username/repo-name e.g. "mmistakes/minimal-mistakes"
teaser                   : # /assets/images/social-preview.jpg
logo                     : "/assets/images/Phoenix%20Farms%20NFP%20Logo_Red_Phoenix%20Farms%20NFP%20Logo_Red.png"
masthead_title           : # overrides the website title displayed in the masthead, use " " for no title
breadcrumbs              : false
words_per_minute         : 200
enable_copy_code_button  : false
copyright                : # "copyright" name, defaults to site.title
copyright_url            : # "copyright" URL, defaults to site.url

# Optional comments. Off until the Giscus repository/category IDs are configured.
# To enable later, set provider to "giscus" and set comments: true for posts.
comments:
  provider               : false
  giscus:
    repo_id              : # Shown during giscus setup at https://giscus.app
    category_name        : # Full text name of the category
    category_id          : # Shown during giscus setup at https://giscus.app
    discussion_term      : # "pathname" (default), "url", "title", "og:title"
    reactions_enabled    : # '1' for enabled (default), '0' for disabled
    theme                : # "light" (default), "dark", "dark_dimmed", "transparent_dark", "preferred_color_scheme"
    strict               : # 1 for enabled, 0 for disabled (default)
    input_position       : # "top", "bottom" # The comment input box will be placed above or below the comments
    emit_metadata        : # 1 for enabled, 0 for disabled (default) # https://github.com/giscus/giscus/blob/main/ADVANCED-USAGE.md#imetadatamessage
    lang                 : # "en" (default)
    lazy                 : # true, false # Loading of the comments will be deferred until the user scrolls near the comments container.
atom_feed:
  path                   : # blank (default) uses feed.xml
  hide                   : false
search                   : true
search_full_content      : true
search_provider          : lunr
lunr:
  search_within_pages    : true
# SEO Related
google_site_verification :
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

# Social Sharing
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : # Open Graph/Twitter default site image
og_image_alt             : # Alt text for Open Graph/Twitter default site image
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : Organization
  name                   : "Phoenix Farms"
  links: []

# Analytics
# Optional analytics. Off by default.
# To enable later, set provider to "google-gtag" and add a tracking_id.
analytics:
  provider               : false
  google:
    tracking_id          :
    anonymize_ip         : true


# Site Author
author:
  name             : "Phoenix Farms"
  avatar           : # path of avatar image, e.g. "/assets/images/bio-photo.jpg"
  bio              :
  location         :
  email            :
  # fediverse      : "@you@instance.social"  # used for fediverse:creator meta tag
  links:
    # - label: "Email"
    #   icon: "fas fa-fw fa-square-envelope"
    #   url: "mailto:hello@example.com"
    # - label: "Instagram"
    #   icon: "fab fa-fw fa-instagram"
    #   url: "https://instagram.com/"

# Organization contact information. Pages and shared components read from here.
contact:
  email: "phoenixfarms.nfp@gmail.com"
  address: "6400 S Kimbark Ave, Chicago, IL 60637"
  location_note: "Plot across from First Presbyterian Church Main Entrance."
  hours: "Food Forest open 24/7."
  donation_subject: "Phoenix Farms Donation"

# Shared donation image used by the Donate page and donation features elsewhere.
donation:
  image: "/assets/images/donate-image.jpg"
  image_alt: "Ripening tomatoes growing among green leaves"

# Add a URL when an official account is ready. Blank placeholder links remain
# visible in the footer as clearly marked coming-soon contact rows.
social_links:
  - label: "Instagram"
    icon: "fab fa-fw fa-instagram"
    url: https://www.instagram.com/phoenixfarms.nfp/
    placeholder: true
  - label: "Facebook"
    icon: "fab fa-fw fa-facebook"
    url:
    placeholder: true

# Site Footer
footer:
  about:
    label: "About"
    url: "/about/"
  contact_label: "Contact"
  newsletter:
    label: "Sign up for our Newsletter!"
    placeholder: "Email address"
    input_name: "email"
    button_label: "Sign-up"
    tally_form_id: "EkgP0B"
    tally_layout: "modal"
    tally_width: 375
    tally_emoji: "🌱"
    tally_emoji_animation: "rubber-band"
  since: "2026"

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - minimal-mistakes-jekyll.gemspec
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs # ignore Minimal Mistakes /docs
  - /test # ignore Minimal Mistakes /test
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style
  quiet_deps: true
  silence_deprecations: ['import']


# Outputting
permalink: /:categories/:title/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# Forest sites
collections:
  forests:
    output: true
    permalink: /our-forest/:name/
  events:
    output: true
    permalink: /events/:name/


# Pagination with jekyll-paginate
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/

# Plugins (previously gems:)
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path>/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path>/my-awesome-category/index.html ~> path: /
tag_archive:
  type: liquid
  path: /blog/tags/
# show_taxonomy: false  # set to false to hide tag/category lists on posts
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development


# Defaults
defaults:
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
      show_title: false
      share: false
      comments: false
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: false
      share: false
      related: false
  # _forests
  - scope:
      path: ""
      type: forests
    values:
      layout: forest
      author_profile: false
      show_title: false
      share: false
      comments: false
  # _events
  - scope:
      path: ""
      type: events
    values:
      layout: event
      author_profile: false
      show_title: false
      share: false
      comments: false

